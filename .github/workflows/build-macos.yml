name: Build macOS installer

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "desktop/**"
      - "public/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gm-manager-macos-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install the macOS packager
        working-directory: desktop
        run: npm install --no-package-lock
      - name: Build the macOS installer
        working-directory: desktop
        run: |
          electron_version=$(node -p 'require("electron/package.json").version')
          archive="electron-v${electron_version}-darwin-x64.zip"
          archive_path="$RUNNER_TEMP/$archive"
          checksum=$(node -e 'const hash = require("electron/checksums.json")[process.argv[1]]; if (!/^[a-f0-9]{64}$/.test(hash ?? "")) process.exit(1); console.log(hash)' "$archive")
          asset_id=$(gh api "repos/electron/electron/releases/tags/v${electron_version}" --jq ".assets[] | select(.name == \"$archive\") | .id")
          [[ "$asset_id" =~ ^[0-9]+$ ]]
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 180 \
            -H 'Accept: application/octet-stream' -H 'Cache-Control: no-cache' -H "Authorization: Bearer $GH_TOKEN" \
            -o "$archive_path" "https://api.github.com/repos/electron/electron/releases/assets/$asset_id?gm-build=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s  %s\n' "$checksum" "$archive_path" | shasum -a 256 -c -
          npm exec electron-builder -- --mac --x64 --publish=never \
            --config.electronDist="$archive_path" --config.dmg.writeUpdateInfo=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
      - name: Publish the current macOS installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release view desktop-latest --repo "$REPOSITORY" >/dev/null 2>&1 || gh release create desktop-latest --repo "$REPOSITORY" --title "GM Manager Desktop" --notes "Bộ cài GM Manager mới nhất cho Windows và macOS."
          gh release upload desktop-latest "desktop/release/GM-CRM-macOS-x64.dmg#GM-CRM-macOS-x64.dmg" --repo "$REPOSITORY" --clobber
