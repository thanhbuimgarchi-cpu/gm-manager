name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Build Windows installer, Build macOS installer]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the checked-out application version
        id: source
        run: echo "version=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node scripts/write-app-version.mjs
        env:
          VITE_APP_VERSION: ${{ steps.source.outputs.version }}
      - name: Stage the verified desktop installers
        id: desktop_installer
        run: node scripts/write-desktop-version.mjs --stage-installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build:github-pages
        env:
          VITE_APP_VERSION: ${{ steps.source.outputs.version }}
          VITE_WINDOWS_INSTALLER_MIRRORED: ${{ steps.desktop_installer.outputs.windows-installer-mirrored }}
          VITE_MACOS_INSTALLER_MIRRORED: ${{ steps.desktop_installer.outputs.macos-installer-mirrored }}
      - run: cp public/.nojekyll github-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
